<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heron</title>
<style>
:root { --bg: #f6f7f9; --text: #15161a; --muted: #5d6270; --card: #ffffff; --line: #e3e5ea; --accent: #6b4cf6; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0b0b10; --text: #eceef3; --muted: #a2a7b4; --card: #15151d; --line: #262634; --accent: #a594ff; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 48px 20px 80px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
header a { color: inherit; text-decoration: none; font-weight: 700; font-size: 20px; }
.gem { width: 30px; height: 30px; border-radius: 9px;
  background: conic-gradient(from 200deg, #7cf0d4, #8a7cff, #ff8fd1, #ffd27c, #7cf0d4); }
h1 { font-size: 34px; line-height: 1.2; margin: 0 0 8px; }
h2 { font-size: 21px; margin: 36px 0 8px; }
p, li { color: var(--text); }
em { color: var(--muted); font-style: normal; }
a { color: var(--accent); }
ul { padding-left: 22px; }
.table { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; }
tr:last-child td { border-bottom: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin: 14px 0; }
footer { margin-top: 56px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
<header><div class="gem"></div><a href="">Heron</a></header>
<h1>Heron</h1>
<p>Block the apps you keep opening, pause before you scroll, and grow a gem for every hour you focus.</p>
<p><a href="privacy/">Privacy policy</a> · <a href="support/">Support</a></p>

<footer>Heron · <a href="privacy/">Privacy</a> · <a href="support/">Support</a> · <a href="mailto:axelhenriksen00@icloud.com">axelhenriksen00@icloud.com</a></footer>
</main>
</body>
</html>
